name: Build Windows

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-windows:
    name: Test and package Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm run dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepy-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.package.outputs.version }}-build.${{ github.run_number }}
          name: Keepy v${{ steps.package.outputs.version }} build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release/*.exe
