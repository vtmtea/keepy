name: Build Windows

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: read

jobs:
  build-windows:
    if: github.event.pull_request.merged == true
    name: Test and package Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout merged master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: keepy-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
