<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keepy · 鼠标活动助手</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">K</div>
        <div>
          <p class="eyebrow">KEEPY</p>
          <h1>鼠标活动助手</h1>
          <p class="subtitle">Windows 托盘工具 · 手动控制</p>
        </div>
      </header>

      <section class="status-card" aria-labelledby="status-title">
        <div class="status-heading">
          <div>
            <p class="section-label">运行状态</p>
            <h2 id="status-title">已暂停</h2>
          </div>
          <span id="status-pill" class="status-pill paused">暂停</span>
        </div>
        <p id="status-detail" class="status-detail">应用会继续驻留在系统托盘中。</p>
        <div class="timeline">
          <div>
            <span class="meta-label">上次动作</span>
            <strong id="last-action">尚未执行</strong>
          </div>
          <div>
            <span class="meta-label">下次动作</span>
            <strong id="next-action">未安排</strong>
          </div>
        </div>
        <div id="error-box" class="error-box" role="alert" hidden></div>
      </section>

      <section class="panel" aria-labelledby="settings-title">
        <div class="panel-heading">
          <div>
            <p class="section-label">活动设置</p>
            <h2 id="settings-title">选择动作与间隔</h2>
          </div>
          <span class="save-state" id="save-state">未保存</span>
        </div>

        <form id="settings-form">
          <label class="field">
            <span>动作间隔</span>
            <div class="number-input">
              <input id="interval" name="interval" type="number" min="10" max="3600" step="1" required />
              <span>秒</span>
            </div>
            <small>可设置 10 秒至 1 小时。</small>
          </label>

          <fieldset class="field mode-field">
            <legend>活动方式</legend>
            <label class="mode-option">
              <input type="radio" name="mode" value="move" />
              <span class="option-copy">
                <strong>轻微移动并还原</strong>
                <small>移动指针 2 像素后自动还原，不会点击当前窗口。</small>
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="click" />
              <span class="option-copy">
                <strong>点击当前鼠标位置</strong>
                <small>会影响当前活动窗口，请只在你明确需要时使用。</small>
              </span>
            </label>
          </fieldset>

          <label id="click-warning" class="acknowledgement" hidden>
            <input id="click-acknowledged" type="checkbox" />
            <span>我知道点击动作可能影响当前活动窗口，并确认由我承担相应影响。</span>
          </label>

          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

          <div class="actions">
            <button id="toggle-button" class="primary-button" type="button">开始 Keepy</button>
            <button id="save-button" class="secondary-button" type="submit">保存设置</button>
          </div>
        </form>
      </section>

      <footer class="footer-note">
        <span class="tray-dot" aria-hidden="true"></span>
        关闭窗口不会退出应用，Keepy 会继续在系统托盘中运行。
      </footer>
    </main>

    <dialog id="close-dialog" class="close-dialog" aria-labelledby="close-dialog-title">
      <form method="dialog" id="close-form">
        <p class="section-label">窗口操作</p>
        <h2 id="close-dialog-title">确认关闭</h2>
        <p class="dialog-copy">请选择关闭窗口后的处理方式。</p>
        <fieldset class="close-options">
          <label class="close-option">
            <input type="radio" name="close-action" value="tray" />
            <span>
              <strong>最小化到托盘</strong>
              <small>Keepy 继续运行，可从托盘重新打开。</small>
            </span>
          </label>
          <label class="close-option">
            <input type="radio" name="close-action" value="quit" />
            <span>
              <strong>直接关闭</strong>
              <small>停止 Keepy 并退出应用。</small>
            </span>
          </label>
        </fieldset>
        <label class="remember-close">
          <input id="remember-close" type="checkbox" />
          <span>下次不再提示</span>
        </label>
        <div class="dialog-actions">
          <button id="cancel-close" class="secondary-button" type="button">取消</button>
          <button class="primary-button" value="confirm" type="submit">确认</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
